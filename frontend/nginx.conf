server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Using a variable in proxy_pass (below)
    # forces nginx to resolve "backend" lazily, per request, instead of once
    # at config-load time — so nginx starts and serves the frontend fine even
    # if the backend container is still starting, crashed, or not up yet,
    # returning 502 for /api/ calls instead of refusing to start at all.
    resolver 127.0.0.11 valid=10s;

    # location /api/ {
    #     set $backend_upstream http://backend:8000;
    #     proxy_pass $backend_upstream/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
