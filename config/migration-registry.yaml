# Canonical registry for the instance-to-instance data migration feature.
#
# Kept deliberately separate from tenant-relations.yaml: that file answers
# "what is this object type's path to Tenant" for the permission-template
# feature; this file answers "how do we migrate this object type" (its
# pynetbox endpoint, what it depends on and under which field name, how to
# match it against an existing object on the target so we don't create
# duplicates, and where to link to it in the NetBox UI for the migration
# report).
#
# Wherever an object type also appears in tenant-relations.yaml, the
# `tenant_relation` value here MUST match it exactly. This is enforced by
# scripts/check_migration_registry_consistency.py and a pytest in
# backend/tests/test_migration_registry.py, so the two files can't quietly
# drift apart on a value they both describe.
#
# Schema per type:
#   endpoint:        pynetbox path, e.g. "dcim.device_types" -> nb.dcim.device_types
#   ui_path:         path segment under the NetBox web UI, e.g. "dcim/device-types"
#     used to build "<base_url>/<ui_path>/<id>/" links in the migration report.
#   selectable:      true if the user can pick this type directly in step 2 of
#     the wizard. false means it only ever appears as an auto-included
#     dependency (e.g. manufacturers, device types).
#   dependencies:    object types (registry keys) that MUST exist on the target
#     before this type can be created. Pulled in transitively, referenced-only
#     (only the specific objects actually referenced by selected data, not
#     every object of that type on the source). The planner discovers these ids
#     in a read-only pass before processing the resulting objects in topological
#     dependency order.
#   optional_dependencies: object types this type MAY reference (tenant,
#     platform, rack, ...). Same referenced-only inclusion, but migrating the
#     primary type never fails just because one of these is absent/skipped —
#     the field is simply left blank on the target object.
#   field_map:       {source JSON field name: dependency type key}, one entry
#     for every type in `dependencies` and `optional_dependencies` (a type may
#     appear as the value for more than one field, e.g. a hypothetical object
#     with two ip-address fields; that's exactly why this is keyed by FIELD
#     NAME rather than by type — the reverse shape can't represent that).
#     Field names are NOT derived from the type name by convention (e.g. a
#     device's role field is "role", not "device_role"; a module's bay field
#     is "module_bay", not "modulebay") — this map is the single source of
#     truth for the real NetBox field name.
#   deferred_field_map: same shape as field_map ({field name: dependency type
#     key}), but for FK fields deliberately EXCLUDED from the dependency
#     graph because including them would create a cycle at the type level
#     (e.g. a device's primary_ip4 points at an IP address, which may be
#     assigned to an interface, which belongs back to that same device).
#     These are never resolved inline during phase `primary` — they always
#     go through build_payload's "defer" path and become a MigrationJobPatch,
#     applied once every phase-`primary` item has reached a terminal state.
#   polymorphic_field_map: for writable GenericForeignKey ID fields whose dependency type
#     varies per object (e.g. ipam.ipaddress.assigned_object_id, which can point
#     at either dcim.interface or virtualization.vminterface depending on the
#     value of the sibling `assigned_object_type` field). Shape:
#       {field_name: {discriminator_field: <sibling field>, type_values: {<discriminator_value>: <dep_type_key>}}}
#     Every dep_type_key in type_values must appear in dependencies or
#     optional_dependencies. Always deferred (patch-only) — same as
#     deferred_field_map, no ordering guarantee.
#   min_netbox_version: optional minimum source NetBox version for a type,
#     written as "major.minor" or "major.minor.patch". A selected type is
#     skipped with a plan warning when the source is older.
#   intentionally_unconverted_fields: nested API fields deliberately omitted
#     from migration because they are read-only or their referenced object
#     type/compound write shape is outside the registry. extract_fields drops
#     these fields so raw nested JSON can never leak into a write payload.
#   tenant_relation: same semantics and values as tenant-relations.yaml:
#     a Django-style path to the Tenant model ("tenant", "device__tenant", ...),
#     or null when there is no path (global catalog objects, or objects whose
#     tenancy can only be reached through a GenericForeignKey).
#   tenant_filterable: true if this type's own NetBox API list endpoint
#     accepts a `tenant` (or equivalent) filter directly, so the tenant filter
#     can be pushed down as a query parameter rather than filtered client-side
#     after fetching everything.
#   match_strategies: an ordered list of natural-key strategies. EVERY
#     strategy whose fields are all present (non-null) on the source object,
#     and whose fk_fields already have a resolved target id, is evaluated —
#     not just the first one — and their results are cross-checked: if they
#     all point to the same target object (or only one produced a result),
#     that's the match; if they point to DIFFERENT target objects, the match
#     is reported as ambiguous for manual review rather than silently
#     trusting the higher-priority strategy (this is exactly how "part
#     number matches object A but model matches object B" is caught). The
#     declared order still matters for which strategy's fields are cited as
#     "the" match in the report when there's no disagreement. Each strategy:
#       fields:    field names to compare (may include fields not in field_map
#         when they're plain scalars, e.g. "slug", "vid", "prefix")
#       fk_fields: subset of `fields` that are references to another
#         migratable object — resolved via the id map built from earlier,
#         already-processed phases (dependencies are always ordered first),
#         never compared as a scalar value. Every fk_field must also appear
#         as a key in this type's field_map (or deferred_field_map).
#   self_parent_field: for the handful of types with a self-referential
#     optional parent (region, site group, location), the JSON field name of
#     that parent reference. Excluded from the type-level dependency graph
#     (see registry.py `TypeSpec.all_dependencies`) since it doesn't affect
#     inter-type ordering, only the order objects of that SAME type must be
#     created in (parent before child) — handled by the planner via depth
#     sorting, not by the type graph.
#   out_of_scope: true for v1 excluded types, kept here (with a reason) so the
#     registry remains the single place documenting scope, and so enabling
#     them later is a registry change, not a rewrite.

version: 1

types:

  # ── Reference / catalog objects ─────────────────────────────────────────

  tenancy.tenantgroup:
    endpoint: "tenancy.tenant_groups"
    ui_path: "tenancy/tenant-groups"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  tenancy.tenant:
    endpoint: "tenancy.tenants"
    ui_path: "tenancy/tenants"
    selectable: false
    dependencies: []
    optional_dependencies: [tenancy.tenantgroup]
    field_map:
      group: tenancy.tenantgroup
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  dcim.region:
    endpoint: "dcim.regions"
    ui_path: "dcim/regions"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  dcim.sitegroup:
    endpoint: "dcim.site_groups"
    ui_path: "dcim/site-groups"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  dcim.site:
    endpoint: "dcim.sites"
    ui_path: "dcim/sites"
    selectable: false
    dependencies: []
    optional_dependencies: [dcim.region, dcim.sitegroup, tenancy.tenant]
    field_map:
      region: dcim.region
      group: dcim.sitegroup
      tenant: tenancy.tenant
    intentionally_unconverted_fields: [owner, asns]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [slug]
        fk_fields: []
      - fields: [name]
        fk_fields: []

  dcim.location:
    endpoint: "dcim.locations"
    ui_path: "dcim/locations"
    selectable: false
    dependencies: [dcim.site]
    optional_dependencies: [tenancy.tenant]
    field_map:
      site: dcim.site
      tenant: tenancy.tenant
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [site, slug]
        fk_fields: [site]

  dcim.rackrole:
    endpoint: "dcim.rack_roles"
    ui_path: "dcim/rack-roles"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  dcim.rack:
    endpoint: "dcim.racks"
    ui_path: "dcim/racks"
    selectable: false
    dependencies: [dcim.site]
    optional_dependencies: [dcim.location, tenancy.tenant, dcim.rackrole]
    field_map:
      site: dcim.site
      location: dcim.location
      tenant: tenancy.tenant
      role: dcim.rackrole
    intentionally_unconverted_fields: [group, rack_type, owner]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [site, name]
        fk_fields: [site]

  dcim.manufacturer:
    endpoint: "dcim.manufacturers"
    ui_path: "dcim/manufacturers"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []
      - fields: [name]
        fk_fields: []

  dcim.devicetype:
    endpoint: "dcim.device_types"
    ui_path: "dcim/device-types"
    selectable: false
    dependencies: [dcim.manufacturer]
    optional_dependencies: [dcim.platform]
    field_map:
      manufacturer: dcim.manufacturer
      default_platform: dcim.platform
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      # Preferred: part number is the more reliable vendor identifier.
      - fields: [manufacturer, part_number]
        fk_fields: [manufacturer]
      - fields: [manufacturer, model]
        fk_fields: [manufacturer]
      - fields: [slug]
        fk_fields: []

  dcim.moduletype:
    endpoint: "dcim.module_types"
    ui_path: "dcim/module-types"
    selectable: false
    dependencies: [dcim.manufacturer]
    optional_dependencies: []
    field_map:
      manufacturer: dcim.manufacturer
    intentionally_unconverted_fields: [profile, module_bay_types, owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [manufacturer, part_number]
        fk_fields: [manufacturer]
      - fields: [manufacturer, model]
        fk_fields: [manufacturer]

  extras.configtemplate:
    endpoint: "extras.config_templates"
    ui_path: "extras/config-templates"
    selectable: true
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [data_source, data_file, owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [name]
        fk_fields: []

  dcim.platform:
    endpoint: "dcim.platforms"
    ui_path: "dcim/platforms"
    selectable: false
    dependencies: []
    optional_dependencies: [dcim.manufacturer, extras.configtemplate]
    field_map:
      manufacturer: dcim.manufacturer
      config_template: extras.configtemplate
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  dcim.devicerole:
    endpoint: "dcim.device_roles"
    ui_path: "dcim/device-roles"
    selectable: false
    dependencies: []
    optional_dependencies: [extras.configtemplate]
    field_map:
      config_template: extras.configtemplate
    self_parent_field: "parent"
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  virtualization.clustertype:
    endpoint: "virtualization.cluster_types"
    ui_path: "virtualization/cluster-types"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  virtualization.clustergroup:
    endpoint: "virtualization.cluster_groups"
    ui_path: "virtualization/cluster-groups"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  virtualization.cluster:
    endpoint: "virtualization.clusters"
    ui_path: "virtualization/clusters"
    selectable: false
    dependencies: [virtualization.clustertype]
    optional_dependencies: [virtualization.clustergroup, dcim.site, tenancy.tenant]
    field_map:
      type: virtualization.clustertype
      group: virtualization.clustergroup
      site: dcim.site
      tenant: tenancy.tenant
    intentionally_unconverted_fields: [owner]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [name, type]
        fk_fields: [type]

  ipam.rir:
    endpoint: "ipam.rirs"
    ui_path: "ipam/rirs"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  ipam.role:
    endpoint: "ipam.roles"
    ui_path: "ipam/roles"
    selectable: false
    dependencies: []
    optional_dependencies: []
    field_map: {}
    intentionally_unconverted_fields: [owner]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [slug]
        fk_fields: []

  ipam.vrf:
    endpoint: "ipam.vrfs"
    ui_path: "ipam/vrfs"
    selectable: true
    dependencies: []
    optional_dependencies: [tenancy.tenant]
    field_map:
      tenant: tenancy.tenant
    intentionally_unconverted_fields: [owner, import_targets, export_targets]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [name, tenant]
        fk_fields: [tenant]

  ipam.vlangroup:
    endpoint: "ipam.vlan_groups"
    ui_path: "ipam/vlan-groups"
    selectable: false
    dependencies: []
    optional_dependencies: [tenancy.tenant]
    field_map:
      tenant: tenancy.tenant
    intentionally_unconverted_fields: [vid_ranges, owner]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [slug]
        fk_fields: []

  # ── Primary: DCIM ─────────────────────────────────────────────────────

  dcim.device:
    endpoint: "dcim.devices"
    ui_path: "dcim/devices"
    selectable: true
    dependencies: [dcim.site, dcim.devicetype, dcim.devicerole]
    optional_dependencies: [tenancy.tenant, dcim.platform, dcim.location, dcim.rack, extras.configtemplate, virtualization.cluster, dcim.virtualchassis]
    field_map:
      site: dcim.site
      device_type: dcim.devicetype
      role: dcim.devicerole
      tenant: tenancy.tenant
      platform: dcim.platform
      location: dcim.location
      rack: dcim.rack
      config_template: extras.configtemplate
      cluster: virtualization.cluster
      virtual_chassis: dcim.virtualchassis
    # primary_ip4/primary_ip6 point at an IP address, which may in turn be
    # assigned to an interface belonging back to this very device — a
    # type-level cycle if modeled as a normal dependency. Always resolved
    # via the phase-`patch` second pass instead.
    deferred_field_map:
      primary_ip4: ipam.ipaddress
      primary_ip6: ipam.ipaddress
      oob_ip: ipam.ipaddress
    intentionally_unconverted_fields: [parent_device, primary_ip, owner]
    tenant_relation: "tenant"
    tenant_filterable: true
    match_strategies:
      - fields: [name, site]
        fk_fields: [site]

  dcim.virtualchassis:
    endpoint: "dcim.virtual_chassis"
    ui_path: "dcim/virtual-chassis"
    selectable: true
    dependencies: []
    optional_dependencies: []
    field_map: {}
    # A virtual chassis' master is one of its own member devices — always a
    # patch, never resolvable at create time (the VC must exist before any
    # member device can reference it, but the master can't be set until at
    # least one member device has itself been created).
    deferred_field_map:
      master: dcim.device
    intentionally_unconverted_fields: [owner, members]
    tenant_relation: null
    tenant_filterable: false
    match_strategies:
      - fields: [name]
        fk_fields: []

  dcim.modulebay:
    endpoint: "dcim.module_bays"
    ui_path: "dcim/module-bays"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: []
    field_map:
      device: dcim.device
    deferred_field_map:
      module: dcim.module
      installed_module: dcim.module
    intentionally_unconverted_fields: [module_bay_types, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.module:
    endpoint: "dcim.modules"
    ui_path: "dcim/modules"
    selectable: true
    dependencies: [dcim.device, dcim.moduletype, dcim.modulebay]
    optional_dependencies: []
    field_map:
      device: dcim.device
      module_type: dcim.moduletype
      module_bay: dcim.modulebay
    intentionally_unconverted_fields: [owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, module_bay]
        fk_fields: [device, module_bay]

  dcim.interface:
    endpoint: "dcim.interfaces"
    ui_path: "dcim/interfaces"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module, ipam.vlan, ipam.vlantranslationpolicy, ipam.vrf]
    field_map:
      device: dcim.device
      module: dcim.module
      untagged_vlan: ipam.vlan
      tagged_vlans: ipam.vlan
      qinq_svlan: ipam.vlan
      vlan_translation_policy: ipam.vlantranslationpolicy
      vrf: ipam.vrf
    # lag/bridge/parent are self-referential (one interface pointing at another, usually but
    # not always on the same device). Unlike region/site-group/location's self_parent_field,
    # these don't form a single clean depth-sortable hierarchy within one type — an interface
    # can be a LAG member, a bridge member, AND a sub-interface's parent simultaneously, with
    # no guaranteed single ordering across a device's whole interface set. Deferred (patch
    # phase) instead: by the time patches run, every interface from phase `primary` already
    # exists for real, so these always resolve then regardless of creation order within the
    # type.
    deferred_field_map:
      lag: dcim.interface
      bridge: dcim.interface
      parent: dcim.interface
      primary_mac_address: dcim.macaddress
    intentionally_unconverted_fields: [vdcs, bridge_interfaces, mac_addresses, cable, wireless_link, wireless_lans, l2vpn_termination, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.consoleport:
    endpoint: "dcim.console_ports"
    ui_path: "dcim/console-ports"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module]
    field_map:
      device: dcim.device
      module: dcim.module
    intentionally_unconverted_fields: [cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.consoleserverport:
    endpoint: "dcim.console_server_ports"
    ui_path: "dcim/console-server-ports"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module]
    field_map:
      device: dcim.device
      module: dcim.module
    intentionally_unconverted_fields: [cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.powerport:
    endpoint: "dcim.power_ports"
    ui_path: "dcim/power-ports"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module]
    field_map:
      device: dcim.device
      module: dcim.module
    intentionally_unconverted_fields: [cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.poweroutlet:
    endpoint: "dcim.power_outlets"
    ui_path: "dcim/power-outlets"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module, dcim.powerport]
    field_map:
      device: dcim.device
      module: dcim.module
      power_port: dcim.powerport
    intentionally_unconverted_fields: [cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.frontport:
    endpoint: "dcim.front_ports"
    ui_path: "dcim/front-ports"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module]
    field_map:
      device: dcim.device
      module: dcim.module
    intentionally_unconverted_fields: [rear_ports, cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.rearport:
    endpoint: "dcim.rear_ports"
    ui_path: "dcim/rear-ports"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.module]
    field_map:
      device: dcim.device
      module: dcim.module
    intentionally_unconverted_fields: [front_ports, cable, owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.devicebay:
    endpoint: "dcim.device_bays"
    ui_path: "dcim/device-bays"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: []
    field_map:
      device: dcim.device
    # installed_device is circular in the same way dcim.device.primary_ip4 is: a device bay's
    # installed_device is itself a dcim.device, and that device's own bay (if any) could point
    # back the other way. Always deferred to the patch phase, never resolved inline.
    deferred_field_map:
      installed_device: dcim.device
    intentionally_unconverted_fields: [owner]
    tenant_relation: "device__tenant"
    tenant_filterable: false
    match_strategies:
      - fields: [device, name]
        fk_fields: [device]

  dcim.inventoryitem:
    endpoint: "dcim.inventory_items"
    ui_path: "dcim/inventory-items"
    selectable: true
    dependencies: [dcim.device]
    optional_dependencies: [dcim.manufacturer]
    field_map:
      device: dcim.device
      manufacturer: dcim.manufacturer
