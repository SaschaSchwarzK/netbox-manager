name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag netbox-manager:test .

      - name: Run container smoke tests
        run: ./scripts/container-smoke-test.sh netbox-manager:test

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netbox-manager:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
