name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        uses: ./.github/actions/build-image
        with:
          tags: netbox-manager:test
          load: "true"
          cache-scope: pull-request

      - name: Run container smoke tests
        run: ./scripts/container-smoke-test.sh netbox-manager:test

      - name: Scan container image with Grype and Trivy
        uses: ./.github/actions/scan-image
        with:
          image: netbox-manager:test
          output-prefix: container
          fail-on-severity: "true"
