name: Release container

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Container version tag (for example: v1.2.3)"
        required: true
        type: string
      publish_latest:
        description: "Also update the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: image
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must be a semantic version such as v1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi

          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$VERSION"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            tags="$tags"$'\n'"$image:latest"
          fi

          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: netbox-manager:release-test
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Run container smoke tests
        run: ./scripts/container-smoke-test.sh netbox-manager:release-test

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netbox-manager:release-test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

      - name: Summarize release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          {
            echo "## Container published"
            echo
            echo "\`$IMAGE:$VERSION\`"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo
              echo "\`$IMAGE:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
