name: Release container

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Container version tag (for example: v1.2.3)"
        required: true
        type: string
      publish_latest:
        description: "Also update the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: image
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must be a semantic version such as v1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi

          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$VERSION"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            tags="$tags"$'\n'"$image:latest"
          fi

          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build test image
        uses: ./.github/actions/build-image
        with:
          tags: netbox-manager:release-test
          load: true
          platforms: linux/amd64
          cache-scope: release

      - name: Run container smoke tests
        run: ./scripts/container-smoke-test.sh netbox-manager:release-test

      - name: Scan container image with Grype and Trivy
        uses: ./.github/actions/scan-image
        with:
          image: netbox-manager:release-test
          output-prefix: release-candidate
          fail-on-severity: "true"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: ./.github/actions/build-image
        with:
          push: true
          load: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-scope: release
          provenance: mode=max
          sbom: true

      - name: Pull the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: docker pull "$IMAGE:$VERSION"

      - name: Scan the published image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          output-prefix: published
          fail-on-severity: "false"

      - name: Generate released-image report
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '{"matches":[]}' > empty-grype.json
          printf '{"Results":[]}' > empty-trivy.json
          python scripts/security_report.py report \
            --before empty-grype.json empty-trivy.json \
            --after published-grype.json published-trivy.json \
            --image "$IMAGE:$VERSION" \
            --output released-image-report.md || true
          python scripts/update_readme_cves.py README.md released-image-report.md "$IMAGE:$VERSION" "$VERSION"

      - name: Open or update README vulnerability PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/released-image-cves
          delete-branch: true
          commit-message: "docs: update released image vulnerabilities"
          title: "docs: update released image vulnerabilities for ${{ inputs.version }}"
          body: |
            Updates the README with the Grype and Trivy results for
            `${{ steps.image.outputs.name }}:${{ inputs.version }}` after publication.
          labels: security,automated,documentation

      - name: Summarize release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          {
            echo "## Container published"
            echo
            echo "\`$IMAGE:$VERSION\`"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo
              echo "\`$IMAGE:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
